{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Gestión de RRHH</title>
  <link rel="stylesheet" href="{% static 'vendor/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-logo"><i class="bi bi-people-fill"></i></div>
    <h1 class="h4 text-center mb-1">Gestión de Recursos Humanos</h1>
    <p class="text-center text-muted mb-4">Acceso al sistema</p>

    {% if error %}
      <div class="alert alert-danger py-2">{{ error }}</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control" required autofocus>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100">
        <i class="bi bi-box-arrow-in-right"></i> Ingresar
      </button>
    </form>

    <div class="login-hint mt-4">
      <div class="fw-bold mb-1">Usuarios de demostración</div>
      <div><code>admin</code> / <code>admin123</code> — Gerente General (total)</div>
      <div><code>rrhh</code> / <code>rrhh1234</code> — Administrativo</div>
      <div><code>consulta</code> / <code>consulta1234</code> — Solo lectura</div>
    </div>
  </div>
</body>
</html>
